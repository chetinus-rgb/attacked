<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Камера</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  body { margin: 0; background: #000; font-family: -apple-system, sans-serif; }
  video { width: 100%; height: 100vh; object-fit: cover; display: none; }
  video.on { display: block; }
  #ui { color: #fff; text-align: center; padding: 40px 16px; }
  button { padding: 14px 24px; font-size: 17px; border-radius: 12px; border: none;
           background: #0a84ff; color: #fff; margin-top: 16px; }
  #link { margin-top: 20px; word-break: break-all; font-size: 15px; }
  #link a { color: #5ac8fa; }
</style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="ui">
    <div id="status">Подключение…</div>
    <div id="btnwrap" style="display:none">
      <button onclick="start()">Включить камеру и начать передачу</button>
    </div>
    <div id="link"></div>
  </div>

<script>
const video = document.getElementById("cam");
const status = document.getElementById("status");
const params = new URLSearchParams(location.search);
const watchId = params.get("watch");

if (watchId) {
  // Режим просмотра: подключаемся к камере другого устройства
  document.getElementById("btnwrap").style.display = "none";
  status.textContent = "Подключаюсь к камере…";

  const peer = new Peer();
  peer.on("open", () => {
    const call = peer.call(watchId, null);
    call.on("stream", s => {
      video.srcObject = s;
      video.classList.add("on");
      status.textContent = "";
    });
    call.on("close", () => { status.textContent = "Соединение закрыто."; });
  });
  peer.on("error", e => { status.textContent = "Ошибка: " + e.type; });

} else {
  // Режим передачи: включаем свою камеру и раздаём ссылку для просмотра
  document.getElementById("status").textContent =
    "Нажми кнопку, чтобы включить камеру.";
  document.getElementById("btnwrap").style.display = "block";
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }, // "user" — фронтальная камера
      audio: true
    });
    video.srcObject = stream;
    video.classList.add("on");

    const peer = new Peer();
    peer.on("open", id => {
      const url = location.origin + location.pathname + "?watch=" + id;
      document.getElementById("link").innerHTML =
        'Отправь эту ссылку тому, кто будет смотреть:<br><br>' +
        '<a href="' + url + '">' + url + '</a>';
    });
    peer.on("call", call => call.answer(stream));
    peer.on("error", e => alert("Ошибка: " + e.type));
  } catch (e) {
    alert("Доступ к камере не получен: " + e.name);
  }
}
</script>
</body>
</html>
